<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Tabela de Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script>
        async function carregarClientes() {
            const resposta = await fetch('/clientes');
            const clientes = await resposta.json();
            const lista = document.getElementById('client-table-body');
            lista.innerHTML = '';
            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${cliente.id_cliente}</td>
                    <td>${cliente.nome}</td>
                    <td>${cliente.telefone}</td>
                    <td>${cliente.email}</td>
                    <td>${cliente.idade}</td>
                    <td>${cliente.data_nascimento}</td>
                    <td class="text-center">
                        <button class="btn btn-danger btn-sm" onclick="removeClient('${cliente.id_cliente}')">Remover</button>
                    </td>`;
                lista.appendChild(row);
            });
        }

        async function removeClient(nif) {
            if (confirm("Tens certeza que desejas remover este cliente?")) {
                const resposta = await fetch('/remove_client', {
                    method: 'DELETE',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ nif })
                });
                if (resposta.ok) {
                    carregarClientes();
                } else {
                    alert('Erro ao remover cliente.');
                }
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById('add-client-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                const dados = {
                    nif: document.getElementById('nif').value,
                    nome: document.getElementById('nome').value,
                    telefone: document.getElementById('telefone').value,
                    email: document.getElementById('email').value,
                    data_nascimento: document.getElementById('data_nascimento').value
                };
                const resposta = await fetch('/new_client', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(dados)
                });
                if (resposta.ok) {
                    carregarClientes();
                    document.getElementById('add-client-form').reset();
                    bootstrap.Modal.getInstance(document.getElementById('addClientModal')).hide();
                } else {
                    alert('Erro ao adicionar cliente.');
                }
            });

            carregarClientes();
        });
    </script>
</head>
<body>
    <div class="container my-4">
        <h1 class="text-center mb-4">Clientes</h1>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>NIF</th>
                    <th>Nome</th>
                    <th>Telefone</th>
                    <th>Email</th>
                    <th>Idade</th>
                    <th>Data de Nascimento</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody id="client-table-body"></tbody>
        </table>
        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addClientModal">Adicionar Cliente</button>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="addClientModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Adicionar Cliente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="add-client-form">
                        <input type="text" id="nif" class="form-control mb-2" placeholder="NIF" required>
                        <input type="text" id="nome" class="form-control mb-2" placeholder="Nome" required>
                        <input type="text" id="telefone" class="form-control mb-2" placeholder="Telefone" required>
                        <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
                        <input type="date" id="data_nascimento" class="form-control mb-2" required>
                        <button type="submit" class="btn btn-success">Submeter</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
